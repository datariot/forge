version: '3.8'

services:
  # PostgreSQL for integration testing
  postgres:
    image: postgres:16-alpine
    container_name: forge-test-postgres
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge-test-password
      POSTGRES_DB: forge_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis for integration testing
  redis:
    image: redis:7-alpine
    container_name: forge-test-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
